<script src="../site.js"></script>
<script>
  var galleryItems = Array.prototype.slice.call(document.querySelectorAll('.gallery-item'));
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var currentIndex = 0;

  var lastFocus = null;
  var lbButtons = [document.getElementById('lb-close'), document.getElementById('lb-prev'), document.getElementById('lb-next')];

  function openLightbox(index){
    currentIndex = index;
    lastFocus = document.activeElement;
    lbImg.src = galleryItems[currentIndex].dataset.full;
    lightbox.classList.add('open');
    document.getElementById('lb-close').focus();
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    lbImg.removeAttribute('src');
    if (lastFocus) lastFocus.focus();
  }
  function showDelta(delta){
    currentIndex = (currentIndex + delta + galleryItems.length) % galleryItems.length;
    lbImg.src = galleryItems[currentIndex].dataset.full;
  }

  galleryItems.forEach(function(item, index){
    item.addEventListener('click', function(e){
      e.preventDefault();
      openLightbox(index);
    });
  });
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', function(){ showDelta(-1); });
  document.getElementById('lb-next').addEventListener('click', function(){ showDelta(1); });
  lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', function(e){
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showDelta(-1);
    if (e.key === 'ArrowRight') showDelta(1);
    if (e.key === 'Tab') {
      var i = lbButtons.indexOf(document.activeElement);
      var next = e.shiftKey ? (i <= 0 ? lbButtons.length - 1 : i - 1) : (i + 1) % lbButtons.length;
      e.preventDefault();
      lbButtons[next].focus();
    }
  });
</script>
