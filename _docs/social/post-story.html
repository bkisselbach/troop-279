<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
  :root{--pine-deep:#141f17;--blaze:#bf4c2c;--cream:#f4efe3;--ink:#2a271f;--muted:#655f4e;--khaki:#cdbe98;}
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--cream);}
  h1,h2{font-family:'Fraunces',serif;margin:0;letter-spacing:-0.01em;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .troop{font-family:'Fraunces',serif;font-weight:700;color:var(--pine-deep);}
  .photos{display:grid;gap:14px;}
  .photos img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;}
  .prices{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .prices div{border:3px solid var(--pine-deep);border-radius:8px;background:#fff;}
  .prices h2{color:var(--pine-deep);}
  .prices span{display:block;color:var(--blaze);font-family:'Fraunces',serif;font-weight:700;}
  .deadline{background:var(--blaze);color:#fff;font-weight:600;text-align:center;border-radius:8px;}
  .order{background:var(--pine-deep);color:var(--cream);border-radius:10px;text-align:center;}
  .order b{display:block;font-family:'Fraunces',serif;color:#fff;}

  .page{width:1080px;height:1920px;padding:100px 80px 110px;display:flex;flex-direction:column;gap:30px;}
  .top img{height:96px;} .troop{font-size:48px;}
  h1{font-size:104px;line-height:1;color:var(--pine-deep);margin-top:10px;}
  .sub{font-size:38px;color:var(--muted);margin:-10px 0 0;}
  .photos{grid-template-columns:1fr 1fr;grid-template-rows:300px 230px;} .photos img{height:100%;min-height:0;}
  .photos img:first-child{grid-row:1 / span 2;}
  .prices div{padding:24px 30px;} .prices h2{font-size:48px;} .prices p{margin:8px 0 0;font-size:31px;line-height:1.45;}
  .deadline{font-size:46px;padding:22px;}
  .order{padding:30px;font-size:32px;margin-top:auto;} .order b{font-size:76px;margin-top:6px;}
</style></head><body><div class="page">
  <div class="top"><img src="../../images/scouts-bsa-horizontal.png" alt=""><div class="troop">Troop 279</div></div>
  <h1>Christmas Wreath Sale</h1>
  <p class="sub">Fresh Fraser fir wreaths. All proceeds support our Scouts.</p>
  <div class="photos"><img src="../../photos/wreaths/decorated-4.jpg"><img src="../../photos/wreaths/decorated-1.jpg"><img src="../../photos/wreaths/plain-1.jpg"></div>
  <div class="prices">
    <div><h2>Plain</h2><p>16&Prime; $25 &middot; 20&Prime; $30<br>24&Prime; $35</p></div>
    <div><h2>Decorated</h2><p>16&Prime; $35 &middot; 20&Prime; $40<br>24&Prime; $45</p></div>
  </div>
  <div class="deadline">Order by Friday, November 14</div>
  <div class="order">Pickup in Point of Rocks or<br>free delivery within 20 miles<b>troop-279.com</b></div>
</div></body></html>
